<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Matching Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'Inter', 'sans-serif'] },
                    colors: { primary: '#1D4ED8', secondary: '#047857', dark: '#1F2937', light: '#F3F4F6' }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #F9FAFB; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        
        /* Custom modal overlay */
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="text-gray-800 antialiased bg-gray-50 flex flex-col h-screen overflow-hidden">

    <!-- Authentication Container -->
    <div id="authContainer" class="absolute inset-0 flex items-center justify-center bg-gray-50 z-[100] p-4 overflow-y-auto">
        <!-- Auth content will be injected here -->
    </div>

    <!-- Main Application Container -->
    <div id="appContainer" class="flex flex-col h-full w-full hidden">
        <!-- Header -->
        <header class="bg-dark text-white p-4 shadow-md z-50 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-3">
                <img src="jobs4all.png" alt="Our figure" class="w-12 h-12 object-contain">
                <h1 class="text-xl font-bold hidden sm:block tracking-wide">Jobs For All</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
                    <span class="text-sm text-gray-400">บทบาท</span>
                    <select id="roleSelector" onchange="switchRole(this.value)" class="bg-transparent text-white text-sm font-medium outline-none cursor-pointer">
                        <option value="employee">👨‍🦽 คนพิการ (Job Seeker)</option>
                        <option value="employer">🏢 ผู้ประกอบการ (Employer)</option>
                        <option value="admin">🛡️ ผู้ดูแลระบบ (Admin)</option>
                    </select>
                </div>
                <!-- Mobile Role Selector Toggle -->
                <button onclick="toggleMobileRoleSelector()" class="md:hidden text-gray-300 hover:text-white">
                     <i class="fas fa-user-cog text-xl"></i>
                </button>
                <div class="w-px h-6 bg-gray-700 hidden md:block"></div>
                <button onclick="logoutSystem()" class="text-gray-300 hover:text-red-400 transition flex items-center gap-2 text-sm font-medium">
                    <i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">ออกจากระบบ</span>
                </button>
            </div>
        </header>
        
        <!-- Mobile Role Selector Dropdown (Hidden by default) -->
        <div id="mobileRoleSelector" class="hidden bg-gray-800 p-3 border-t border-gray-700 shrink-0">
             <label class="block text-xs text-gray-400 mb-1">สลับมุมมอง:</label>
             <select onchange="switchRole(this.value); toggleMobileRoleSelector();" class="w-full bg-gray-700 text-white rounded p-2 text-sm outline-none">
                 <option value="employee">👨‍🦽 คนพิการ</option>
                 <option value="employer">🏢 ผู้ประกอบการ</option>
                 <option value="admin">🛡️ ผู้ดูแลระบบ</option>
             </select>
        </div>

        <div class="flex flex-1 overflow-hidden relative">
            <!-- Mobile Menu Toggle Button -->
            <button onclick="toggleSidebar()" class="md:hidden absolute bottom-4 right-4 bg-primary text-white w-12 h-12 rounded-full shadow-lg z-50 flex items-center justify-center hover:bg-blue-700 transition">
                <i class="fas fa-bars text-xl"></i>
            </button>

            <!-- Sidebar -->
            <aside id="sidebar" class="w-64 bg-white shadow-xl flex flex-col z-40 border-r border-gray-100 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0">
                <div class="p-6 border-b border-gray-100 flex items-center gap-4 bg-gray-50 shrink-0">
                    <div id="userAvatar" class="w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-sm"></div>
                    <div class="overflow-hidden">
                        <h2 id="userName" class="font-bold text-gray-800 truncate">ชื่อผู้ใช้</h2>
                        <p id="userRoleText" class="text-xs text-gray-500 truncate">บทบาท</p>
                    </div>
                </div>
                <nav id="navMenu" class="flex-1 overflow-y-auto py-2 custom-scrollbar"></nav>
            </aside>
            
            <!-- Sidebar Overlay for Mobile -->
            <div id="sidebarOverlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black bg-opacity-50 z-30 md:hidden"></div>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50 relative custom-scrollbar" id="mainContent"></main>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Custom Modal Container -->
    <div id="modalContainer" class="hidden fixed inset-0 z-[150] modal-overlay flex items-center justify-center p-4">
        <div id="modalContent" class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 transform scale-95 opacity-0 transition-all duration-300">
            <!-- Modal content injected here -->
        </div>
    </div>

                { id: 'J03', title: 'Graphic Designer', company: 'Creative Agency', location: 'กรุงเทพฯ', type: 'Part-time', salary: 'ตามตกลง', reqDisability: ['การได้ยิน', 'การเคลื่อนไหว'], accommodations: ['ล่ามภาษามือออนไลน์', 'ทางลาด'], status: 'pending', applicants: 0 }

            ],

                { id: 'L01', title: 'เทคนิคการสัมภาษณ์งานออนไลน์อย่างมั่นใจ', type: 'Video', length: '15 mins', category: 'Soft Skills' },
                { id: 'L02', title: 'การใช้งานโปรแกรมตารางคำนวณเบื้องต้น (Excel)', type: 'Course', length: '2 hrs', category: 'Hard Skills' },
                { id: 'L03', title: 'สิทธิประโยชน์คนพิการในสถานที่ทำงาน', type: 'Article', length: '5 mins read', category: 'Knowledge' }
            ]
        };

        let currentRole = 'employee';
        let currentMenu = 'home';
        let isSidebarOpen = false;

        // Navigation Configuration based on Role
        const NAV_CONFIG = {
            employee: [
                { id: 'home', icon: 'fa-home', label: 'หน้าหลัก (Dashboard)' },
                { id: 'search_job', icon: 'fa-search', label: 'ค้นหางาน' },
                { id: 'my_work', icon: 'fa-briefcase', label: 'งานที่สมัคร' },
                { id: 'assessment', icon: 'fa-clipboard-list', label: 'แบบประเมินบุคลิกภาพ/ทักษะ' },
                { id: 'learning', icon: 'fa-graduation-cap', label: 'ทักษะที่ต้องเพิ่มเติม' },
                { id: 'job_coaching', icon: 'fa-chalkboard-teacher', label: 'ผู้ฝึกสอนงาน' },
                { id: 'setting', icon: 'fa-cog', label: 'ตั้งค่าข้อมูลส่วนตัว' }
            ],
            employer: [
                { id: 'home', icon: 'fa-chart-pie', label: 'หน้าหลัก (Dashboard)' },
                { id: 'create_job', icon: 'fa-plus-circle', label: 'สร้างประกาศงาน' },
                { id: 'job_list', icon: 'fa-list', label: 'จัดการประกาศงาน' },
                { id: 'applicant_list', icon: 'fa-users', label: 'รายชื่อผู้สมัคร' },
                { id: 'search_employee', icon: 'fa-search', label: 'ค้นหาพนักงาน' },
                { id: 'setting', icon: 'fa-building', label: 'ตั้งค่าบริษัท' }
            ],
            admin: [
                { id: 'dashboard', icon: 'fa-tachometer-alt', label: 'ภาพรวมระบบ' },
                { id: 'job_pending', icon: 'fa-clipboard-check', label: 'ตรวจสอบประกาศงาน' },
                { id: 'user_list', icon: 'fa-users-cog', label: 'จัดการผู้ใช้งาน' },
                { id: 'learning_media', icon: 'fa-book-open', label: 'จัดการสื่อการเรียนรู้' },
                { id: 'system_setting', icon: 'fa-cogs', label: 'ตั้งค่าระบบ' }
            ]
        };

        function initApp() {
            document.getElementById('authContainer').classList.remove('hidden');
            document.getElementById('appContainer').classList.add('hidden');
            renderLogin();
        }

        function loginSystem(role) {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            
            // Set role selector to match
            document.getElementById('roleSelector').value = role;
            
            // Initialize app with selected role
            switchRole(role);
        }

        function logoutSystem() {
            showToast('ออกจากระบบเรียบร้อย', 'info');
            setTimeout(() => {
                initApp();
            }, 800);
        }

        function switchRole(role) {
            currentRole = role;
            currentMenu = (role === 'admin') ? 'dashboard' : 'home';
            
            updateSidebarProfile();
            renderSidebarMenu();
            renderContent();
            
            // Close sidebar on mobile after switching role
            if (isSidebarOpen) toggleSidebar();
        }

        function setMenu(menuId) {
            currentMenu = menuId;
            renderSidebarMenu();
            renderContent();
            
            // Close sidebar on mobile after clicking menu
            if (window.innerWidth < 768 && isSidebarOpen) {
                toggleSidebar();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            isSidebarOpen = !isSidebarOpen;
            
            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }
        
        function toggleMobileRoleSelector() {
            const selector = document.getElementById('mobileRoleSelector');
            selector.classList.toggle('hidden');
        }

        function renderLogin() {
            const container = document.getElementById('authContainer');
            container.innerHTML = `
                <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md fade-in border border-gray-100">
                    <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 overflow-hidden">
                        <img src="jobs4all.png" alt="Our figure" class="w-full h-full object-cover">
                    </div>
                        <h2 class="text-2xl font-bold text-gray-800">Jobs for ALL</h2>
                        <p class="text-gray-500 text-sm mt-1">Job Matching Platform</p>
                    </div>
                    
                    <div class="mb-6 bg-gray-50 p-6 rounded-xl border border-gray-100">
                        <!--
                        <h3 class="text-lg font-bold text-gray-800 mb-1 border-b pb-2">โมดูล "บัญชี"</h3>
                        -->
                        <p class="text-gray-500 text-sm mb-4">เข้าสู่ระบบสำหรับผู้ที่มีบัญชีแล้ว</p>
                        <form onsubmit="event.preventDefault(); loginSystem('employee');" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล / ชื่อผู้ใช้</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-envelope text-gray-400"></i></div>
                                    <input type="text" class="w-full border border-gray-300 rounded-lg pl-10 px-4 py-2 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="example@email.com">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-lock text-gray-400"></i></div>
                                    <input type="password" class="w-full border border-gray-300 rounded-lg pl-10 px-4 py-2 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="••••••••">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-primary text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 shadow-md transition flex justify-center items-center gap-2">
                                <span>เข้าสู่ระบบ</span> <i class="fas fa-arrow-right"></i>
                            </button>
                        </form>
                    </div>
                    
                    <div class="text-center pt-2">
                        <!--
                            <h3 class="text-md font-bold text-gray-800 mb-1">โมดูล "คนใหม่"</h3>
                        -->
                            <p class="text-gray-500 text-sm mb-3">ยังไม่มีบัญชีใช่หรือไม่?</p>
                        <button onclick="renderSelectRole()" class="w-full bg-white text-dark border-2 border-dark font-bold py-2.5 rounded-lg hover:bg-gray-50 transition">
                            ลงทะเบียนสร้างบัญชีใหม่
                        </button>
                    </div>
                </div>
            `;
        }

        function renderSelectRole() {
            const container = document.getElementById('authContainer');
            container.innerHTML = `
                <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl fade-in border border-gray-100">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">เลือกบทบาท</h2>
                        <!--

                        -->
                        </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Employee Role -->
                        <div onclick="renderRegisterEmployee()" class="cursor-pointer border-2 border-gray-200 hover:border-primary rounded-xl p-6 text-center hover:bg-blue-50 transition group bg-white shadow-sm hover:shadow-md">
                            <div class="w-20 h-20 mx-auto bg-blue-100 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition duration-300 shadow-inner">
                                <i class="fas fa-wheelchair text-3xl text-primary"></i>
                            </div>
                            <h3 class="text-xl font-bold text-gray-800">ผู้พิการ (Job Seeker)</h3>
                            <!--
                            <p class="text-sm text-gray-500 mt-2">ต้องการสร้างโปรไฟล์ หางาน และทำแบบประเมินทักษะ</p>
                            -->
                            </div>
                        
                        <!-- Employer Role -->
                        <div onclick="renderRegisterEmployer()" class="cursor-pointer border-2 border-gray-200 hover:border-secondary rounded-xl p-6 text-center hover:bg-emerald-50 transition group bg-white shadow-sm hover:shadow-md">
                            <div class="w-20 h-20 mx-auto bg-emerald-100 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition duration-300 shadow-inner">
                                <i class="fas fa-building text-3xl text-secondary"></i>
                            </div>
                            <h3 class="text-xl font-bold text-gray-800">ผู้ประกอบการ (Employer)</h3>
                            <!--
                                <p class="text-sm text-gray-500 mt-2">ต้องการสร้างประกาศงานและค้นหาพนักงานที่เหมาะสม</p>

                    </div>
                    
                    <div class="mt-8 text-center border-t border-gray-100 pt-6">

        }

        function renderRegisterEmployer() {
            const container = document.getElementById('authContainer');
            container.innerHTML = `

                                <div>
                                    <label class="block text-sm mb-1 font-medium text-gray-700">ชื่อบริษัท / องค์กร *</label>
                                    <input type="text" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required placeholder="เช่น บริษัท ตัวอย่าง จำกัด">
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm mb-1 font-medium text-gray-700">เลขประจำตัวผู้เสียภาษี *</label>
                                        <input type="text" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required>
                                    </div>
                                    <div>
                                        <label class="block text-sm mb-1 font-medium text-gray-700">ประเภทธุรกิจ</label>

                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-gray-50 p-5 rounded-lg border border-gray-200">

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm mb-1 font-medium text-gray-700">ชื่อผู้ติดต่อ *</label>
                                    <input type="text" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-secondary" required>
                                </div>
                                <div>
                                    <label class="block text-sm mb-1 font-medium text-gray-700">ตำแหน่ง</label>
                                    <input type="text" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-secondary">
                                </div>
                                <div>
                                    <label class="block text-sm mb-1 font-medium text-gray-700">เบอร์โทรศัพท์ *</label>
                                    <input type="tel" class="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-secondary" required>
                                </div>
                                <div>
                                    <label class="block text-sm mb-1 font-medium text-gray-700">อีเมล (สำหรับเข้าสู่ระบบ) *</label>

        function handleCoachFormSubmit() {
            // Get form data
            const formData = new FormData(document.querySelector('form[onsubmit*="handleCoachFormSubmit"]'));
            const coach = document.querySelector('input[name="coach"]:checked').value;
            const topic = document.querySelector('select').value;
            const contactMethod = document.querySelector('input[name="contactMethod"]:checked').value;
            const timeSlot = document.querySelector('input[name="timeSlot"]:checked').value;
            const message = document.querySelector('textarea[name="message"]').value;
            const phone = document.querySelector('input[placeholder="08X-XXX-XXXX"]').value;
            const email = document.querySelector('input[placeholder="your.email@example.com"]').value;

            // Validate required fields
            if (!topic || !message || !phone) {
                showToast('โปรดกรอกข้อมูลที่จำเป็นให้ครบถ้วน', 'error');
                return;
            }

            // Validate phone format
            if (!/^\d{10}$/.test(phone.replace(/-/g, ''))) {
                showToast('โปรดกรอกเบอร์โทรศัพท์ที่ถูกต้อง', 'error');
                return;
            }

            // Simulate form submission
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>กำลังส่ง...';

            // Simulate network delay
            setTimeout(() => {
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;

                // Show success message
                showToast('ส่งแบบฟอร์มเรียบร้อย ผู้ฝึกสอนจะติดต่อกลับภายใน 24 ชั่วโมง', 'success');

                // Reset form
                document.querySelector('form[onsubmit*="handleCoachFormSubmit"]').reset();

                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });

                // Log submission details (for debugging)
                console.log('Coach Contact Form Submitted:', {
                    coach: coach,
                    topic: topic,
                    method: contactMethod,
                    timeSlot: timeSlot,
                    message: message,
                    phone: phone,
                    email: email,
                    timestamp: new Date().toLocaleString('th-TH')
                });
            }, 1500);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let config = { icon: 'fa-info-circle', bg: 'bg-gray-800' };
            if (type === 'success') config = { icon: 'fa-check-circle', bg: 'bg-emerald-600' };
            if (type === 'error') config = { icon: 'fa-exclamation-triangle', bg: 'bg-red-600' };
            
            toast.className = `${config.bg} text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 fade-in font-medium transform transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto border border-white border-opacity-20`;
            toast.innerHTML = `<i class="fas ${config.icon} text-lg"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });
            
            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
